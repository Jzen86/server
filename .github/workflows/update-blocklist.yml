name: Update blocklist DB

on:
  schedule:
    # Каждые 6 часов
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build blocklist.json
        run: python3 build-blocklist.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blocklist.json
          if git diff --cached --quiet; then
            echo "База не изменилась, коммит не нужен."
          else
            git commit -m "chore: обновить blocklist.json"
            git push
          fi